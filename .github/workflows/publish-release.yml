name: Publish addon release

on:
  push:
    branches: [main]
    paths:
      - "FrostSeek_AuraTracker/FrostSeek_AuraTracker.toc"
      - "RELEASE_v*.md"
      - "dist/FrostSeek_AuraTracker-v*.zip"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate release files
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' FrostSeek_AuraTracker/FrostSeek_AuraTracker.toc | head -n 1)"
          test -n "$version"
          tag="v$version"
          notes="RELEASE_${tag}.md"
          asset="dist/FrostSeek_AuraTracker-${tag}.zip"
          test -f "$notes"
          test -f "$asset"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "FrostSeek Aura Tracker $TAG" \
            --notes-file "$NOTES"
